# ---------------------------------------------------------------------------
# Daily rebuild → GitHub Pages
#
# Refreshes https://myfinancialria.github.io/myfinancial/ every market weekday
# from sources that need no key and no login:
#
#   NSE bhavcopy      every listed company's OHLCV, turnover and delivery %
#   NSE index lists   sector labels and index membership
#   AMFI NAVAll       every mutual fund scheme + today's NAV
#   mfapi.in          each scheme's full NAV history
#
# Company fundamentals (P/E, ROE, market cap…) are NOT fetched here: the free
# endpoint rate-limits shared CI addresses hard. They are refreshed locally with
# `npm run data:fundamentals` and committed as data/fundamentals_wide.json,
# which this build reads. That keeps the nightly build unattended and reliable.
# ---------------------------------------------------------------------------
name: Daily rebuild (GitHub Pages)

on:
  schedule:
    # 21:00 IST, Mon–Fri. IST has no DST, so 15:30 UTC never drifts.
    # Timed deliberately late: NSE publishes the full bhavcopy around 18:00-18:30
    # IST and AMFI publishes NAVs later still, so an evening run picks up the
    # same trading day rather than yesterday's.
    - cron: "30 15 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Historical bhavcopies and NAV histories never change, so caching them
      # turns a 20-minute cold build into a one-minute incremental one. The key
      # rotates weekly; restore-keys let a new week start from last week's copy.
      - name: Restore market data cache
        uses: actions/cache@v4
        with:
          path: var
          key: market-data-${{ github.run_id }}
          restore-keys: |
            market-data-

      - name: Prices — NSE bhavcopy (every listed company)
        run: node scripts/fetch_prices.mjs --years 5

      - name: Sectors & index membership
        run: node scripts/fetch_indices.mjs

      - name: Universe — NSE symbol master
        run: node scripts/fetch_universe.mjs

      - name: Mutual funds — AMFI + full NAV history
        run: node scripts/fetch_funds.mjs

      # The fundamentals layer is a bonus: a committed snapshot already covers it,
      # so nothing in this Python block may fail the deploy. The site must publish
      # from the keyless Node sources whatever happens here.
      - uses: actions/setup-python@v5
        continue-on-error: true
        with:
          python-version: "3.12"
          cache: pip
          # pip caching looks for requirements.txt / pyproject.toml by default
          # and hard-fails when it finds neither, so point it at ours
          cache-dependency-path: requirements-data.txt

      - name: Install the fundamentals fetcher
        run: pip install -r requirements-data.txt
        continue-on-error: true

      # Best-effort, never fatal, and deliberately narrow: --only-missing skips
      # everything the committed snapshot already covers, so this closes gaps
      # (newly listed companies, symbols Yahoo was down for) instead of
      # re-walking 2,000 names that Yahoo would throttle it out of anyway.
      # Anything it does fetch lands in var/yfin, which the cache carries into
      # the next run, so coverage accumulates across days.
      - name: Fundamentals — close any gaps (best effort)
        run: python3 scripts/fetch_yfinance.py --only-missing --liquid-first --workers 4
        continue-on-error: true
        timeout-minutes: 6

      - name: Compute every screener metric
        run: node scripts/build_screener.mjs

      - name: Render the site
        run: node scripts/build_app.mjs

      - name: Daily brief + landing page
        run: node scripts/build_pages.mjs
        env:
          AIMLAPI_KEY: ${{ secrets.AIMLAPI_KEY }}
          AIMLAPI_MODEL: ${{ secrets.AIMLAPI_MODEL }}
        continue-on-error: true    # the brief is a bonus; never fail the deploy for it

      - name: Verify the build before publishing
        run: node scripts/verify_build.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
