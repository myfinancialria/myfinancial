# ---------------------------------------------------------------------------
# Daily rebuild → GitHub Pages
#
# Refreshes https://myfinancialria.github.io/myfinancial/ every market weekday
# from sources that need no key and no login:
#
#   NSE bhavcopy      every listed company's OHLCV, turnover and delivery %
#   NSE index lists   sector labels and index membership
#   AMFI NAVAll       every mutual fund scheme + today's NAV
#   mfapi.in          each scheme's full NAV history
#
# Company fundamentals come from a committed snapshot plus a rotating top-up,
# because the free endpoint rate-limits shared CI addresses hard. That is fine
# for the SLOW-moving parts (earnings per share, book value, share count, which
# only move on results days) — and the price ratios built on them, P/E, P/B,
# market cap and EV/EBITDA, are recomputed against today's close on every build,
# so nothing on the page is quoted at a price that is no longer current.
# ---------------------------------------------------------------------------
name: Daily rebuild (GitHub Pages)

on:
  schedule:
    # IST has no DST, so a fixed UTC offset never drifts.
    #
    # 08:00 IST — the pre-market brief. The US has closed, Asia is trading and
    # Europe has not opened, which is exactly the picture worth publishing
    # before India opens at 09:15.
    - cron: "30 2 * * 1-5"
    #
    # 17:00 IST — the post-market report, as asked for. NSE does not publish the
    # official bhavcopy until ~18:30, so this run reports live quotes and the
    # page labels itself PROVISIONAL.
    - cron: "30 11 * * 1-5"
    #
    # 21:00 IST — the full rebuild. Deliberately late: the bhavcopy is out and
    # AMFI has published NAVs, so this picks up the same trading day rather than
    # yesterday's, and re-cuts the evening report on the settled numbers.
    - cron: "30 15 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Historical bhavcopies and NAV histories never change, so caching them
      # turns a 20-minute cold build into a one-minute incremental one. The key
      # rotates weekly; restore-keys let a new week start from last week's copy.
      - name: Restore market data cache
        uses: actions/cache@v4
        with:
          path: var
          key: market-data-${{ github.run_id }}
          restore-keys: |
            market-data-

      # Until the holdings work the build used nothing but Node builtins, so
      # this step did not exist and its absence was invisible. Parsing AMC
      # disclosure workbooks needs SheetJS, and without an install the holdings
      # build fails — which continue-on-error then turns into a green run that
      # silently publishes nothing. Install at the root, not just in web/.
      - name: Install build dependencies
        run: npm ci --omit=dev

      - name: Prices — NSE bhavcopy (every listed company)
        run: node scripts/fetch_prices.mjs --years 5

      - name: Sectors & index membership
        run: node scripts/fetch_indices.mjs

      - name: Universe — NSE symbol master
        run: node scripts/fetch_universe.mjs

      - name: Mutual funds — AMFI + full NAV history
        run: node scripts/fetch_funds.mjs

      # The fundamentals layer is a bonus: a committed snapshot already covers it,
      # so nothing in this Python block may fail the deploy. The site must publish
      # from the keyless Node sources whatever happens here.
      - uses: actions/setup-python@v5
        continue-on-error: true
        with:
          python-version: "3.12"
          cache: pip
          # pip caching looks for requirements.txt / pyproject.toml by default
          # and hard-fails when it finds neither, so point it at ours
          cache-dependency-path: requirements-data.txt

      - name: Install the fundamentals fetcher
        run: pip install -r requirements-data.txt
        continue-on-error: true

      # Best-effort, never fatal, and deliberately narrow: --only-missing skips
      # everything the committed snapshot already covers, so this closes gaps
      # (newly listed companies, symbols Yahoo was down for) instead of
      # re-walking 2,000 names that Yahoo would throttle it out of anyway.
      # Anything it does fetch lands in var/yfin, which the cache carries into
      # the next run, so coverage accumulates across days. --refresh-oldest also
      # rotates ~150 of the stalest records through each run, so the whole
      # universe refreshes about every two weeks instead of freezing forever.
      - name: Fundamentals — close any gaps (best effort)
        run: python3 scripts/fetch_yfinance.py --only-missing --refresh-oldest 150 --liquid-first --workers 4
        continue-on-error: true
        timeout-minutes: 6

      # Portfolio disclosures. NOT live data: SEBI requires monthly disclosure
      # within 10 days of month end (fortnightly for debt), so this polls daily
      # and picks each filing up within hours of it appearing. A published
      # filing never changes, so anything already cached is never refetched —
      # on a normal day this is a few listing-page requests and no downloads.
      #
      # Best-effort: an AMC redesigning its download page must not take the
      # whole site down for it.
      - name: Holdings — AMC portfolio disclosures (best effort)
        run: node scripts/fetch_holdings.mjs
        continue-on-error: true
        timeout-minutes: 8

      - name: Compute every screener metric
        run: node scripts/build_screener.mjs

      # Reads whatever disclosures are cached; a no-op when there are none.
      - name: Scheme holdings and fund overlap
        run: node scripts/build_holdings.mjs
        continue-on-error: true

      - name: Render the site
        run: node scripts/build_app.mjs

      # The React app is a second front end over the SAME published data — it
      # fetches dist/data/*.json rather than carrying a copy — so it builds
      # after the data does, straight into dist/app/.
      - name: Install the app's dependencies
        run: npm --prefix web ci
      - name: Build the app
        run: npm --prefix web run build

      - name: Daily brief + landing page
        run: node scripts/build_pages.mjs
        env:
          AIMLAPI_KEY: ${{ secrets.AIMLAPI_KEY }}
          AIMLAPI_MODEL: ${{ secrets.AIMLAPI_MODEL }}
        continue-on-error: true    # the brief is a bonus; never fail the deploy for it

      # The 8am brief and the 5pm report. Reads dist/data/stocks.json, so it runs
      # after the screener; writes var/insights.json, which the cache carries
      # between runs so the morning brief never blanks last night's report.
      #
      # Best effort: a rate-limited quote feed or a publisher's RSS being down
      # must not stop the rest of the site deploying.
      - name: Insights — pre-market brief / post-market report
        run: node scripts/build_insights.mjs
        continue-on-error: true
        timeout-minutes: 10

      - name: Verify the build before publishing
        run: node scripts/verify_build.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
